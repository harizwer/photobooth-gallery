<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photobooth Gallery</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: event title, then a print-proportioned grid; tapping opens a full-screen viewer with Save */
:root{
  --bg:#f7f6f4; --surface:#ffffff; --fg:#22201d; --muted:#6b6560; --line:#e4e0da;
  --accent:#7a3b5c; --accent-fg:#ffffff; --scrim:rgba(14,12,11,.94);
  --display:'Cormorant Garamond',Georgia,serif; --body:'Manrope',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131211; --surface:#1d1b19; --fg:#f0ece7; --muted:#a9a19a; --line:#2f2b28;
  --accent:#e6a3c4; --accent-fg:#2a0f1d; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top)) 56px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{text-align:center;display:flex;flex-direction:column;gap:6px;margin-bottom:28px}
.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.05;margin:0;text-wrap:balance}
.date{color:var(--muted)}
.count{font-size:.9rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid button{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;aspect-ratio:2/3}
.grid button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid img{width:100%;height:100%;object-fit:contain;display:block;border-radius:2px}
.msg{text-align:center;color:var(--muted);padding:48px 0;display:flex;flex-direction:column;gap:10px;align-items:center}
.msg b{color:var(--fg);font-size:1.1rem}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:13px 24px;min-height:48px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.single{display:flex;flex-direction:column;align-items:center;gap:18px}
.single img{max-width:100%;max-height:70vh;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.18);background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hint{font-size:.88rem;color:var(--muted);text-align:center;max-width:46ch}
.viewer{position:fixed;inset:0;background:var(--scrim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:10}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:calc(100% - 90px);object-fit:contain;border-radius:3px;background:#fff}
.viewer .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.viewer .btn{background:#2a2725;color:#f3eee9;border-color:#3b3633}
.viewer .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Photobooth</div>
    <h1 id="title">Photo Gallery</h1>
    <div class="date" id="date"></div>
    <div class="count" id="count"></div>
  </header>
  <main id="main"><div class="msg"><div class="spinner" aria-hidden="true"></div>Loading photos…</div></main>
  <footer>Tap a photo to view and save it.</footer>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img id="vImg" alt="Photobooth photo">
  <div class="bar">
    <button class="btn" id="vPrev" type="button" aria-label="Previous photo">‹</button>
    <button class="btn primary" id="vSave" type="button">Save photo</button>
    <button class="btn" id="vNext" type="button" aria-label="Next photo">›</button>
    <button class="btn" id="vClose" type="button">Close</button>
  </div>
</div>

<script>
'use strict';
// Public, read-only connection to the photobooth's online gallery.
const SUPABASE_URL = 'https://dqeyaimxfkursttbdmyp.supabase.co';
const PUBLIC_KEY = 'sb_publishable_5L_AdtFZpAALRTBqUTQ_ng_a13JfUEM';
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const eventId = (params.get('e') || '').replace(/[^a-z0-9-]/gi, '');
const photoId = (params.get('p') || '').replace(/[^a-z0-9-]/gi, '');
const fileUrl = path => `${SUPABASE_URL}/storage/v1/object/public/photos/${path}`;
let photos = [], current = -1;

async function rest(query) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${query}`, { headers: { apikey: PUBLIC_KEY } });
  if (!r.ok) throw new Error('Could not load the gallery (' + r.status + ')');
  return r.json();
}
function message(title, text, spin) {
  $('#main').innerHTML = `<div class="msg">${spin ? '<div class="spinner" aria-hidden="true"></div>' : ''}<b></b><span></span></div>`;
  $('#main b').textContent = title; $('#main span').textContent = text || '';
}

async function savePhoto(photo) {
  const name = `photobooth-${photo.id}.jpg`;
  try {
    const blob = await (await fetch(fileUrl(photo.path))).blob();
    const file = new File([blob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    window.open(fileUrl(photo.path), '_blank');
  }
}

async function loadEvent() {
  const ev = (await rest(`events?id=eq.${eventId}&select=name,event_date`))[0];
  if (ev) { $('#title').textContent = ev.name || 'Photo Gallery'; $('#date').textContent = ev.event_date || ''; document.title = (ev.name || 'Photobooth') + ' · Gallery'; }
  return ev;
}

/* ---------- One guest's photo (from the booth QR code) ---------- */
async function showSingle() {
  const started = Date.now();
  message('Your photo is on its way…', 'It usually takes a few seconds to arrive.', true);
  for (;;) {
    const found = (await rest(`photos?id=eq.${photoId}&select=id,path,event_id`).catch(() => []))[0];
    if (found) {
      loadEvent().catch(() => {});
      $('#main').innerHTML = `<div class="single"><img alt="Your photobooth photo"><div class="actions"><button class="btn primary" id="save" type="button">Save photo</button><a class="btn" id="all" href="#">See all photos</a></div><p class="hint">On iPhone, tap Save photo and choose "Save Image". You can also press and hold the photo.</p></div>`;
      $('.single img').src = fileUrl(found.path);
      $('#save').onclick = () => savePhoto(found);
      $('#all').href = `?e=${encodeURIComponent(eventId)}`;
      return;
    }
    if (Date.now() - started > 5 * 60 * 1000) { message('Your photo isn\'t online yet', 'The booth may be offline. Please try this link again later — it will keep working.'); return; }
    await new Promise(r => setTimeout(r, 4000));
  }
}

/* ---------- The whole event ---------- */
function renderGrid() {
  $('#count').textContent = photos.length ? `${photos.length} photo${photos.length === 1 ? '' : 's'}` : '';
  if (!photos.length) return message('No photos yet', 'Photos appear here as soon as guests use the booth.');
  const grid = document.createElement('div'); grid.className = 'grid';
  photos.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `Open photo ${photos.length - i}`);
    const img = document.createElement('img'); img.loading = 'lazy'; img.alt = ''; img.src = fileUrl(p.thumb_path);
    b.appendChild(img); b.onclick = () => openViewer(i); grid.appendChild(b);
  });
  $('#main').replaceChildren(grid);
}
async function refreshGrid() {
  const list = await rest(`photos?event_id=eq.${eventId}&select=id,path,thumb_path,created_at&order=created_at.desc&limit=2000`);
  if (list.length !== photos.length || (list[0] && photos[0] && list[0].id !== photos[0].id)) { photos = list; if ($('#viewer').hidden) renderGrid(); }
}
function openViewer(i) { current = i; $('#vImg').src = fileUrl(photos[i].path); $('#viewer').hidden = false; $('#vSave').focus(); }
function step(d) { if (!photos.length) return; openViewer((current + d + photos.length) % photos.length); }
$('#vPrev').onclick = () => step(-1);
$('#vNext').onclick = () => step(1);
$('#vSave').onclick = () => savePhoto(photos[current]);
$('#vClose').onclick = () => { $('#viewer').hidden = true; renderGrid(); };
document.addEventListener('keydown', e => {
  if ($('#viewer').hidden) return;
  if (e.key === 'Escape') $('#vClose').click();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

(async () => {
  if (!eventId) { message('Scan the QR code at the photobooth', 'Each event has its own gallery link.'); return; }
  try {
    const ev = await loadEvent();
    if (photoId) { document.querySelector('footer').hidden = true; return showSingle(); }
    if (!ev) { message('Gallery not found', 'Check the link, or ask the photobooth team for a new one.'); return; }
    await refreshGrid();
    if (!photos.length) renderGrid();
    setInterval(() => refreshGrid().catch(() => {}), 30000);
  } catch (e) { message('Could not load the gallery', 'Check your internet connection and refresh the page.'); }
})();
</script>
</body>
</html>
