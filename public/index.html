<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a0612">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" id="favicon">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Your photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap">
<style>
/* Guest page: one photo (from a guest QR) or a whole album (from the admin's album QR).
   The Raysnap look, same as the tablet and raysnapphotobooth.com: velvet maroon, gold, copper buttons, Playfair titles. */
:root{--bg:#16030a;--fg:#FAF5EE;--muted:#C9B6A8;--line:rgba(212,175,55,.38);--gold:#D4AF37;--gold2:#F3DE9A;--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--script:'Playfair Display',Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(90% 55% at 50% 0,#4a0d1e 0,#2a0612 55%,#16030a 100%) fixed,#16030a;color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;min-height:100vh;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--script);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#E6C35C;margin-bottom:12px}
.brand img{width:38px;height:38px;object-fit:cover;border-radius:50%;box-shadow:0 0 0 1.5px rgba(212,175,55,.6)}
.cap{font-family:var(--script);font-weight:600;font-size:12px;letter-spacing:.28em;color:#E6C35C;text-transform:uppercase}
h1{font-family:var(--script);font-style:italic;font-weight:700;font-size:clamp(32px,8.5vw,52px);line-height:1.1;margin:4px 0 0;text-wrap:balance;background:linear-gradient(180deg,#FFF1C2 0,#E6C35C 45%,#B8862B 80%,#E9CD7A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
.date{font-size:14px;color:#E2D0C2}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.media{max-width:100%;max-height:62vh;border-radius:3px;box-shadow:0 0 0 2px rgba(212,175,55,.55),0 20px 50px rgba(0,0,0,.55);background:#FBF6EC;display:block}
.actions{width:min(390px,100%);display:flex;flex-direction:column;gap:10px}
.hd{width:min(390px,100%);margin-top:14px;padding-top:18px;border-top:1px solid rgba(212,175,55,.25);display:flex;flex-direction:column;gap:12px}
.hdt{font-family:var(--script);font-weight:700;font-size:21px;color:var(--gold2)}.hdt span{display:block;font-family:var(--sans);font-weight:400;font-size:13.5px;color:var(--muted);margin-top:2px}
.hdrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hdt-tile{all:unset;cursor:pointer;position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1.5px solid rgba(212,175,55,.38);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-weight:700;color:#E9DCCD}
.hdt-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hdt-tile em{position:absolute;left:8px;top:7px;font-style:normal;font-size:11.5px;font-weight:700;background:rgba(26,4,11,.78);color:var(--gold2);border-radius:6px;padding:1px 7px}
.hdt-tile i{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:rgba(26,4,11,.82);border:1px solid rgba(212,175,55,.6);display:flex;align-items:center;justify-content:center;color:#E6C35C}
.hdt-tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{font:inherit;cursor:pointer;height:52px;border-radius:999px;border:1.5px solid rgba(212,175,55,.55);background:rgba(255,255,255,.04);color:#FAF0E2;font-size:15.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;padding:0 22px}
.btn.pri{background:linear-gradient(140deg,#DA8458,#A64F31);border-color:#F0C27A;color:#fff;font-size:16px;height:56px;box-shadow:0 12px 28px rgba(195,104,70,.4)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:340px}
.msg b{font-family:var(--script);font-weight:700;font-size:26px;line-height:1.15;background:linear-gradient(180deg,#FFF1C2 0,#E6C35C 45%,#B8862B 80%,#E9CD7A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.msg p{margin:0;color:#E2D0C2}
.ico{width:80px;height:80px;border-radius:50%;border:1.5px solid rgba(212,175,55,.6);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(212,175,55,.2);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.grid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;align-items:start}
.grid button{all:unset;cursor:pointer;position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:#FBF6EC;box-shadow:0 0 0 1.5px rgba(212,175,55,.5),0 10px 24px rgba(0,0,0,.4)}
.grid button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--gold);color:#2a1408}
.viewer{position:fixed;inset:0;background:rgba(18,2,7,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;z-index:10}
.viewer[hidden]{display:none}
.viewer .media{max-height:calc(100vh - 120px)}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pin{display:flex;gap:10px;width:min(320px,100%)}
.pin input{flex:1;min-width:0;height:52px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);font:inherit;font-size:20px;text-align:center;letter-spacing:.3em}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.4)}
.seg button{font:inherit;cursor:pointer;height:38px;padding:0 20px;border-radius:999px;border:0;background:transparent;color:#E9DCCD;font-weight:700}
.seg button.on{background:var(--gold);color:#2a1408}
footer{text-align:center;color:#B8A598;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:14px}
.book{width:min(390px,100%);border-radius:20px;padding:14px 16px;border:1px solid rgba(212,175,55,.42);background:linear-gradient(135deg,rgba(195,104,70,.22),rgba(212,175,55,.08));text-align:left;display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--fg)}
.book img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.book b{font-family:var(--script);font-weight:700;font-size:16px;display:block;line-height:1.25}
.book span{font-size:13px;color:#E6C35C;font-weight:700}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand" hidden></div>
    <div class="cap" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="date" id="date"></div>
  </header>
  <main id="main"><div class="msg"><div class="spin" aria-hidden="true"></div><p>Loading…</p></div></main>
  <footer id="foot"></footer>
</div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div id="vMedia"></div>
  <div class="bar"><button class="btn pri" id="vSave">Save</button><button class="btn" id="vGif" hidden>Save GIF</button><button class="btn" id="vClose">Close</button></div>
</div>
<script>
'use strict';
const SUPABASE_URL = 'https://dqeyaimxfkursttbdmyp.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxZXlhaW14Zmt1cnN0dGJkbXlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODc2NTQsImV4cCI6MjEwODg2MzY1NH0.T5tHvHVpNzNHwxYFASy8WO6xr1bvfBko9gxHCoxVQSc';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fileUrl = p => `${location.origin}/files/${p}`;   // photos are stored in Cloudflare R2, served by this website
const q = new URLSearchParams(location.search);
async function rpc(fn, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('Could not load (' + r.status + ')');
  return r.json();
}
function studio(s) {
  s = s || {}; const name = s.brand || 'Photobooth Studio';
  $('#brand').hidden = false; $('#brand').innerHTML = (s.logo ? `<img src="${esc(s.logo)}" alt="">` : '') + `<span>${esc(name)}</span>`;
  if (s.logo) { const fav = document.getElementById('favicon'); if (fav) fav.href = s.logo; }   // the browser tab shows the studio's logo
  const book = /raysnap/i.test(name) ? `<a class="book" href="https://raysnapphotobooth.com/?utm_source=guest-page" target="_blank" rel="noopener">${s.logo ? `<img src="${esc(s.logo)}" alt="">` : ''}<div><b>Nak photobooth untuk majlis anda?</b><span>raysnapphotobooth.com →</span></div></a>` : '';
  $('#foot').innerHTML = book + `<span>${esc(s.footer || ('Photos by ' + name))}</span>`; document.title = name;
}
function message(title, text, icon = true) {
  const glass = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#E6C35C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3c0 5 8 6 8 9s-8 4-8 9M16 3c0 5-8 6-8 9s8 4 8 9"/></svg>';
  $('#main').innerHTML = `<div class="msg">${icon ? `<div class="ico">${glass}</div>` : ''}<b>${esc(title)}</b><p>${esc(text)}</p></div>`;
}
const isVideo = k => k === 'boom' || k === 'video';
function mediaHtml(item, cls = 'media') {
  if (isVideo(item.kind) && item.media) return `<video class="${cls}" src="${esc(fileUrl(item.media))}" poster="${esc(fileUrl(item.path))}" autoplay loop muted playsinline controls></video>`;
  return `<img class="${cls}" src="${esc(fileUrl(item.kind === 'gif' && item.media ? item.media : item.path))}" alt="Your photobooth ${item.kind === 'gif' ? 'GIF' : 'photo'}">`;
}
async function save(item, which) {
  const path = which === 'photo' ? item.path : which === 'gif' ? item.media : (item.kind === 'photo' ? item.path : item.media || item.path), name = path.split('/').pop();
  try {
    const blob = await (await fetch(fileUrl(path))).blob();
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [file] }); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { if (e.name !== 'AbortError') window.open(fileUrl(path), '_blank'); }
}
const fmtDate = d => d || '';

async function showOne(tok) {
  let d = await rpc('get_shared_photo', { tok });
  // Just taken? The booth may still be uploading it: wait up to ~40 s.
  for (let i = 0; !d && i < 20; i++) {
    message('Getting your photo ready…', 'It was just taken and is still uploading. This takes a few seconds.', false);
    $('#main .msg').insertAdjacentHTML('afterbegin', '<div class="spin" aria-hidden="true"></div>');
    await new Promise(r => setTimeout(r, 2000)); d = await rpc('get_shared_photo', { tok });
  }
  if (!d) { studio(null); return message('Photo not found', 'This link is not valid any more. Ask the photobooth team if you still need your photo.'); }
  studio(d.studio); $('#eyebrow').textContent = 'Your photo from'; $('#title').textContent = d.event || ''; $('#date').textContent = fmtDate(d.date);
  if (d.expired) return message('This link has expired', 'Photo links work for 12 hours after the photo is taken. Ask the photobooth team for the event album if you still need your photo.');
  const item = { kind: d.kind, path: d.path, media: d.media_path };
  $('#eyebrow').textContent = { photo: 'Your photo from', gif: 'Your GIF from', boom: 'Your boomerang from', video: 'Your video from' }[d.kind] || 'Your photo from';
  const label = { photo: 'Save photo', gif: 'Save GIF', boom: 'Save boomerang', video: 'Save video' }[d.kind] || 'Save';
  const dl = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>';
  const withGif = d.kind === 'photo' && !!d.media_path, extraVid = withGif && /\.(mp4|webm)$/i.test(d.media_path), extraName = extraVid ? 'Boomerang' : 'GIF';
  $('#main').innerHTML = (withGif ? `<div class="seg" role="tablist" aria-label="Show"><button role="tab" class="on" data-v="photo" aria-selected="true">Photo</button><button role="tab" data-v="gif" aria-selected="false">${extraName}</button></div>` : '')
    + `<div id="pv">${mediaHtml(item)}</div><div class="actions"><button class="btn pri" id="save">${dl}${label}</button>${withGif ? `<button class="btn" id="saveGif">${dl}Save ${extraName.toLowerCase()}</button>` : ''}${navigator.share ? '<button class="btn" id="share">Share</button>' : ''}</div>`;
  $('#save').onclick = () => save(item, d.kind === 'photo' ? 'photo' : undefined);
  if (withGif) {
    $('#saveGif').onclick = () => save(item, 'gif');
    $('#main .seg').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; $$('#main .seg button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); }); $('#pv').innerHTML = b.dataset.v === 'gif' ? (extraVid ? `<video class="media" src="${esc(fileUrl(d.media_path))}" autoplay loop muted playsinline></video>` : `<img class="media" src="${esc(fileUrl(d.media_path))}" alt="Your photobooth GIF">`) : mediaHtml(item); };
  }
  if ($('#share')) $('#share').onclick = () => navigator.share({ title: d.event || 'Photo', url: location.href }).catch(() => {});
  const hd = Array.isArray(d.originals) ? d.originals : [];
  if (hd.length) {
    const small = p => fileUrl(p.replace(/\.jpg$/i, '-t.jpg'));
    $('#main').insertAdjacentHTML('beforeend', `<div class="hd"><div class="hdt">Your photos in HD <span>Full quality from the camera. Tap to save.</span></div><div class="hdrow">${hd.map((p, i) => `<button class="hdt-tile" data-hd="${i}" aria-label="Save photo ${i + 1} in HD"><span>Photo ${i + 1}</span><img src="${esc(small(p))}" alt="" loading="lazy" onerror="this.remove()"><em>${i + 1}</em><i>${dl}</i></button>`).join('')}</div></div>`);
    $('#main .hd').onclick = e => { const b = e.target.closest('[data-hd]'); if (b) save({ path: hd[+b.dataset.hd] }, 'photo'); };
  }
}
async function showAlbum(tok, pin = '') {
  const d = await rpc('get_album', { tok, pin });
  studio(d.studio); $('#eyebrow').textContent = 'Photo album'; $('#title').textContent = d.event || ''; $('#date').textContent = fmtDate(d.date);
  if (d.status === 'missing') return message('Album not found', 'This album link is not valid any more.');
  if (d.status === 'off') return message('This album is closed', 'The photobooth team has switched this album off.');
  if (d.status === 'expired') return message('This album has expired', 'Ask the photobooth team if you still need the photos.');
  if (d.status === 'pin') {
    $('#main').innerHTML = `<form class="msg" id="pinForm"><b>Enter the album PIN</b><p>${d.wrong ? 'That PIN is not right. Try again.' : 'The photobooth team gave you a PIN for this album.'}</p><div class="pin"><input id="pin" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN" required><button class="btn pri" style="height:50px">Open</button></div></form>`;
    $('#pin').focus();
    $('#pinForm').onsubmit = e => { e.preventDefault(); showAlbum(tok, $('#pin').value.trim()); };
    return;
  }
  const list = d.photos || [];
  if (!list.length) return message('No photos yet', 'Photos appear here as soon as guests use the booth.', false);
  $('#date').textContent = [fmtDate(d.date), `${list.length} ${list.length === 1 ? 'photo' : 'photos'}`].filter(Boolean).join(' · ');
  const tag = { gif: 'GIF', boom: 'BOOMERANG', video: 'VIDEO' };
  $('#main').innerHTML = `<div class="grid">${list.map((p, i) => `<button data-i="${i}" aria-label="Open photo ${i + 1}"><img src="${esc(fileUrl(p.thumb))}" alt="" loading="lazy" onload="this.parentNode.style.aspectRatio=this.naturalWidth+'/'+this.naturalHeight">${tag[p.kind] ? `<span class="tag">${tag[p.kind]}</span>` : ''}</button>`).join('')}</div>`;
  let cur = null;
  $('#main').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; cur = list[+b.dataset.i]; $('#vMedia').innerHTML = mediaHtml(cur); $('#vGif').hidden = !(cur.kind === 'photo' && cur.media); $('#vGif').textContent = cur.media && /\.(mp4|webm)$/i.test(cur.media) ? 'Save boomerang' : 'Save GIF'; $('#viewer').hidden = false; $('#vClose').focus(); };
  $('#vSave').onclick = () => cur && save(cur);
  $('#vGif').onclick = () => cur && save(cur, 'gif');
  $('#vClose').onclick = () => { $('#viewer').hidden = true; $('#vMedia').innerHTML = ''; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#vClose').click(); });
}
(async () => {
  try {
    if (q.get('album')) await showAlbum(q.get('album'));
    else if (q.get('p') || q.get('q')) await showOne(q.get('p') || q.get('q'));
    else { studio(null); message('Scan your QR code', 'Open the link from the QR code at the photobooth to see your photo.', false); }
  } catch (e) { studio(null); message('Could not load', 'Check your internet connection and try again.'); }
})();
</script>
</body>
</html>
