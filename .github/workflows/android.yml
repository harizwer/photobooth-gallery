# Builds the Android booth app (android/) and puts the APK + logs on the "apk-build" branch.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test the Canon USB code (pretend camera)
        shell: bash
        run: sh android/test-jvm/run.sh 2>&1 | grep -v '^canon:' | tee test.log
      - name: Build the APK
        shell: bash
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish APK and logs
        if: always()
        shell: bash
        run: |
          mkdir out
          cp test.log build.log out/ 2>/dev/null || true
          cp android/app/build/outputs/apk/release/app-release.apk out/photobooth.apk 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_number }} ${{ job.status }}" > out/STATUS
          cd out
          git init -q
          git checkout -q -b apk-build
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Android build ${{ github.run_number }} (${{ job.status }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-build

  # Opens the app in an Android 10 emulator (same Android as the booth tablet) and checks it works
  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get the APK
        run: |
          git fetch -q origin apk-build
          git show origin/apk-build:photobooth.apk > app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash android/test-emulator/run.sh
      - name: Publish emulator results
        if: always()
        shell: bash
        run: |
          git clone -q --depth 5 --branch apk-build "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pub
          rm -rf pub/emulator-${{ matrix.api }} && mkdir pub/emulator-${{ matrix.api }}
          cp -r out-emu/* pub/emulator-${{ matrix.api }}/ 2>/dev/null || true
          cd pub
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Emulator Android API ${{ matrix.api }}, build ${{ github.run_number }} (${{ job.status }})" || true
          for i in 1 2 3; do git push -q origin HEAD:apk-build && break; git pull -q --rebase origin apk-build; done
